# Reference defaults for the Web wrapper, which receives paths from trainprocess.
# Invoke train_by_mlx.sh; this file is not passed to mlx_lm.lora directly.
model: Qwen/Qwen3-1.7B
batch_size: 1
learning_rate: 0.0001
max_seq_length: 4096
grad_checkpoint: true
grad_accumulation_steps: 1
mask_prompt: true
group_by_length: true
validation_batches: 4
lora_parameters:
  rank: 8
  # MLX scale is alpha/r, matching PEFT alpha=16 and rank=8.
  scale: 2.0
  dropout: 0.1
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
